name: macOS DMG

# Сборка и проверка DMG на GitHub Actions - без тега и релиза:
# вручную (workflow_dispatch) и на изменения кода в PR/push.
# Релиз ждёт и macOS-сборку, поэтому ломать её лучше узнать здесь, а не на теге.
# Анализ и тесты - в ci.yml, здесь только сборка и запуск.
# Результат - артефакт vysh-macos-ci.dmg, скачивается со страницы запуска.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'lib/**'
      - 'assets/**'
      - 'tools/build_dmg.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'third_party/**'
      - '.github/workflows/macos-dmg.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'lib/**'
      - 'assets/**'
      - 'tools/build_dmg.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'third_party/**'
      - '.github/workflows/macos-dmg.yml'

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - name: Terminal directory and shortcut regressions
        run: flutter test test/directory_tracking_test.dart test/terminal_shortcut_parity_test.dart test/follow_terminal_directory_test.dart

      - name: Сборка приложения и DMG
        # Не tools/build_dmg.sh: оформление окна через Finder AppleScript
        # на CI не сохранится (нет сессии пользователя) - чистый hdiutil.
        run: |
          BUILD_DATE=$(TZ=UTC git log -1 --date=format-local:'%d.%m.%y %H:%M:%S' --format=%cd)
          flutter build macos --release --dart-define="BUILD_DATE=$BUILD_DATE"
          STAGING=build/dmg_ci_staging
          rm -rf $STAGING && mkdir -p $STAGING
          cp -R build/macos/Build/Products/Release/vysh.app $STAGING/
          ln -s /Applications $STAGING/Applications
          hdiutil create -volname "vysh" -srcfolder $STAGING \
            -ov -format UDZO -quiet "vysh-macos-ci.dmg"

      - name: Проверка DMG
        run: |
          hdiutil verify vysh-macos-ci.dmg
          MOUNT=$(mktemp -d)
          hdiutil attach vysh-macos-ci.dmg -mountpoint "$MOUNT" -quiet -nobrowse
          ls "$MOUNT"
          test -d "$MOUNT/vysh.app" || { echo "::error::vysh.app нет в образе"; exit 1; }
          test -d "$MOUNT/Applications" || { echo "::error::ссылки на Программы нет"; exit 1; }
          # Без App Sandbox: SSH-клиенту нужен ~/.ssh (ключи по пути из хоста).
          codesign -d --entitlements - --xml "$MOUNT/vysh.app" 2>/dev/null \
            | plutil -extract com.apple.security.app-sandbox raw -o - - 2>/dev/null \
            | grep -q true && { echo "::error::App Sandbox включён - ~/.ssh будет недоступен"; exit 1; }
          codesign --verify --deep --strict "$MOUNT/vysh.app" || { echo "::error::подпись недействительна"; exit 1; }
          # Универсальная сборка: и Apple Silicon, и Intel.
          ARCHS=$(lipo -archs "$MOUNT/vysh.app/Contents/MacOS/vysh")
          echo "архитектуры: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::не universal: $ARCHS"; exit 1 ;; esac
          # Приложение стартует: запускаем в фоне, ждём, проверяем, убиваем
          # (раннер macos-latest даёт GUI-сессию; timeout из coreutils на macOS нет).
          "$MOUNT/vysh.app/Contents/MacOS/vysh" & APP=$!
          sleep 20
          kill -0 $APP 2>/dev/null && echo "приложение живо после 20с" \
            || { echo "::error::приложение упало при запуске"; exit 1; }
          kill $APP 2>/dev/null || true
          hdiutil detach "$MOUNT" -quiet || true

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: vysh-macos-dmg
          path: vysh-macos-ci.dmg
          retention-days: 14
