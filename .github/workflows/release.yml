name: Release

# Ставим тег vX.Y.Z → собираются Linux, Windows, macOS и Android → файлы прикрепляются к релизу.
on:
  push:
    tags: ['v*']

# Запись в репозиторий нужна только шагу публикации (см. job release).
permissions:
  contents: read

env:
  # Та же версия, что в ci.yml и docs/RELEASING.md.
  FLUTTER_VERSION: 3.47.6

jobs:
  # Сборки и публикация - только для коммита, прошедшего проверки.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия тега = pubspec.yaml = lib/app/version.dart, есть запись в CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          line=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          pub="${line%%+*}"
          build="${line##*+}"
          dart_ver=$(sed -nE "s/^const appVersion = '([^']+)';/\1/p" lib/app/version.dart)
          dart_build=$(sed -nE 's/^const vyshBuildNumber = ([0-9]+);/\1/p' lib/app/version.dart)
          fail=0
          [ "$tag" = "$pub" ] || { echo "::error::Тег $tag, а в pubspec.yaml $pub"; fail=1; }
          [ "$pub" = "$dart_ver" ] || { echo "::error::pubspec.yaml $pub, а в version.dart $dart_ver"; fail=1; }
          [ "$build" = "$dart_build" ] || { echo "::error::Номер сборки: pubspec.yaml $build, version.dart $dart_build"; fail=1; }
          if ! grep -qF "## [$tag]" CHANGELOG.md; then
            case "$tag" in
              *-*) echo "::warning::В CHANGELOG.md нет раздела [$tag]" ;;
              *) echo "::error::В CHANGELOG.md нет раздела [$tag]"; fail=1 ;;
            esac
          fi
          exit $fail
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  linux:
    # TODO (этап 6): собирать в контейнере на старой базе ради Astra + AppImage/deb через fastforge.
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define="BUILD_DATE=$(TZ=UTC git log -1 --date=format-local:'%d.%m.%y %H:%M:%S' --format=%cd)"
      - name: Упаковать tar.gz
        run: |
          cp LICENSE build/linux/x64/release/bundle/LICENSE
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/vysh-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vysh-*-linux-x64.tar.gz

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - shell: bash
        run: flutter build windows --release --dart-define="BUILD_DATE=$(TZ=UTC git log -1 --date=format-local:'%d.%m.%y %H:%M:%S' --format=%cd)"
      - name: Упаковать zip
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          # Рантайм MSVC рядом с exe - чтобы работало без установки VC++ Redistributable.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:/Windows/System32/$dll" $dir
          }
          Copy-Item LICENSE $dir  # текст GPL прикладывается к каждой копии
          Compress-Archive -Path "$dir/*" `
            -DestinationPath "vysh-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vysh-*-windows-x64.zip

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Ключ подписи из секретов
        id: key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Без секретов APK не собираем: подписанный debug-ключом нельзя обновить поверх.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64, APK пропущен (см. docs/RELEASING.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vysh-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/vysh-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'
      # Кэш Gradle (дистрибутив, AGP, Kotlin, зависимости плагинов). На теге
      # он только читается: его пишет warm-cache.yml в main - кэш тега
      # следующему тегу недоступен.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ok == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: steps.key.outputs.ok == 'true'
        run: flutter pub get
      - if: steps.key.outputs.ok == 'true'
        run: flutter build apk --release --split-per-abi --dart-define="BUILD_DATE=$(TZ=UTC git log -1 --date=format-local:'%d.%m.%y %H:%M:%S' --format=%cd)"
      - name: Переименовать APK
        if: steps.key.outputs.ok == 'true'
        run: |
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$f" "vysh-${GITHUB_REF_NAME}-android-${abi}.apk"
          done
      - name: Проверить подпись APK
        if: steps.key.outputs.ok == 'true'
        env:
          # Ожидаемый SHA-256 сертификата (Settings → Variables → ANDROID_CERT_SHA256).
          # Не задан - проверяются только схемы подписи и отсутствие debug-ключа.
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          apksigner="$ANDROID_HOME/build-tools/$bt/apksigner"
          for f in vysh-*-android-*.apk; do
            # --min-sdk-version 23: иначе при minSdk >= 24 apksigner схему v1
            # не проверяет вовсе и всегда пишет «v1 … false». Если v1 нет,
            # verify с этим флагом завершится ошибкой (нет META-INF/MANIFEST.MF).
            out=$("$apksigner" verify --min-sdk-version 23 --verbose --print-certs "$f")
            echo "== $f"; echo "$out" | grep -E "Verified using|certificate (SHA-256|DN)"
            for scheme in "v1 scheme (JAR signing)" "v2 scheme (APK Signature Scheme v2)"; do
              echo "$out" | grep -q "Verified using $scheme: true" \
                || { echo "::error::$f: нет подписи $scheme"; exit 1; }
            done
            if echo "$out" | grep -q "CN=Android Debug"; then
              echo "::error::$f подписан debug-ключом"; exit 1
            fi
            if [ -n "$EXPECTED_CERT" ]; then
              cert=$(echo "$out" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
              [ "$cert" = "$EXPECTED_CERT" ] \
                || { echo "::error::$f: сертификат $cert, ожидался $EXPECTED_CERT"; exit 1; }
            fi
          done
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: vysh-*-android-*.apk

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release --dart-define="BUILD_DATE=$(TZ=UTC git log -1 --date=format-local:'%d.%m.%y %H:%M:%S' --format=%cd)"
      - name: Упаковать DMG
        # create-dmg на CI-раннере падает на AppleScript - собираем hdiutil.
        run: |
          STAGING=build/dmg_staging
          rm -rf $STAGING && mkdir -p $STAGING
          cp -R build/macos/Build/Products/Release/vysh.app $STAGING/
          cp LICENSE $STAGING/LICENSE
          ln -s /Applications $STAGING/Applications
          hdiutil create -volname "vysh" -srcfolder $STAGING \
            -ov -format UDZO "vysh-${GITHUB_REF_NAME}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: vysh-*-macos.dmg

  release:
    needs: [linux, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужны теги - для ссылки «все изменения»
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: PKGBUILD для Arch Linux
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release/make_pkgbuild.py dist
      - name: Контрольные суммы SHA-256 для встроенного обновления
        run: |
          cd dist
          sha256sum vysh-* > SHA256SUMS
      - name: Текст релиза из CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 tools/release/make_notes.py dist > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
