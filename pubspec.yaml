name: vysh
description: "Минималистичный и красивый SSH-менеджер подключений для Windows и Linux."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  window_manager: ^0.5.0
  screen_retriever: ^0.2.0
  dartssh2: ^4.1.0
  xterm2: ^5.2.0
  flutter_secure_storage: ^11.0.0
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
