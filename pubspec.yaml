name: vysh
description: "Минималистичный и красивый SSH-менеджер подключений для Windows, Linux, macOS и Android."
publish_to: 'none'
version: 0.5.8+63

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  window_manager: ^0.5.0
  screen_retriever: ^0.2.0
  dartssh2: ^4.1.0
  xterm2: ^5.2.0
  flutter_secure_storage: ^11.0.0
  file_selector: ^1.0.3
  path_provider: ^2.1.0
  super_drag_and_drop: ^0.9.1
  super_clipboard: ^0.9.1
  flutter_pty: ^0.4.2

# xterm2 с правкой: клавиатура Android не в анонимном режиме (third_party/xterm2/PATCHES.md).
dependency_overrides:
  xterm2:
    path: third_party/xterm2
  # super_drag_and_drop 0.9 просит device_info_plus <12 (win32 5), а
  # flutter_secure_storage 11 - win32 6. API, которым он пользуется
  # (androidInfo.version.sdkInt), в 13.x тот же.
  device_info_plus: ^13.3.0
  # Копии с правкой сборки под Gradle 9 (project.exec убран), см.
  # third_party/*/VYSH_PATCH.md. Без них не собирается APK.
  super_native_extensions:
    path: third_party/super_native_extensions
  irondash_engine_context:
    path: third_party/irondash_engine_context
  # Копия с правками для Android (compileSdk 36, minSdk 26), см.
  # third_party/flutter_pty/VYSH_PATCH.md. Нужна для настоящего PTY
  # в локальном терминале на Android.
  flutter_pty:
    path: third_party/flutter_pty

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/vysh_256.png
    - assets/fonts/OFL.txt
  # Шрифт терминала по умолчанию на macOS и Android, на Windows и Linux -
  # в запасной цепочке. Вариант NL (без лигатур), только два начертания:
  # около 420 КБ. Курсив Flutter наклонит сам.
  fonts:
    - family: JetBrains Mono NL
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNL-Bold.ttf
          weight: 700
